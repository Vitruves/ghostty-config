# Builds ghostty-config for macOS and Linux, Intel and ARM, when a version
# tag (1.2.3, no "v") is pushed, and publishes the archives and their
# checksums as the GitHub release install.sh downloads from, then the same
# binaries as wheels on PyPI (pip install ghostty-config).
#
# The tool is pure Go, so one runner cross-compiles every target. Linux
# binaries are static and run on any distribution. bump_version.sh pushes the
# tag that starts this.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    # The tests were written on macOS and drive its settings too.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist build/release
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ghostty-config_${VERSION}_${os}_${arch}"
            mkdir -p "build/release/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "build/release/$name/ghostty-config" ./cmd/ghostty-config
            cp LICENSE README.md "build/release/$name/"
            tar -C build/release -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "Version $VERSION" --generate-notes --verify-tag
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/release/
          if-no-files-found: error

  pypi:
    # Trusted publishing: PyPI knows this repository, this workflow and the
    # "pypi" environment, so no token is stored anywhere.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ghostty-config/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: build/release

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build wheels
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python pypi/build_wheels.py "$VERSION" build/release dist
          pip install --quiet twine
          twine check --strict dist/*

      - name: Check a wheel installs and runs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --no-index --find-links dist ghostty-config=="$VERSION"
          /tmp/venv/bin/ghostty-config -version

      - uses: pypa/gh-action-pypi-publish@release/v1
